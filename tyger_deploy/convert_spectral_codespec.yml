# Convert a tar of one spectral (1pul/fid) scan directory to an MRD2 stream.
#
#   tar cf - -C /data KIC_Huh7msps5_08-15-2025.mrs \
#     | tyger run exec -f tyger_deploy/convert_spectral_codespec.yml > raw.mrd2
#
# Tyger turns each declared buffer into a named FIFO and passes its path in <NAME>_PIPE. --tar has
# to be spelled out, since it is what selects the input mode; --output would default to
# $OUTPUT_PIPE on its own but is spelled out here so the wiring is visible in the codespec.
#
# The image is shared with convert_epsi_codespec.yml: MRStomrd2.py reads the sequence name out of
# each .MRD and converts EPSI or spectral accordingly. This codespec differs only in the memory it
# asks for, since a spectral scan is usually a single file holding every repetition on its nex
# axis rather than one file per repetition.
job:
  codespec:
    image: ghcr.io/medcap/mrs-convert:latest
    buffers:
      inputs: ["input"]
      outputs: ["output"]
    args:
      - --tar
      - $(INPUT_PIPE)
      - --output
      - $(OUTPUT_PIPE)
    resources:
      requests:
        cpu: 1
        # a spectral scan is one file, so this is roomier than it needs to be
        memory: 1G

  tags:
    version: "1.0"

  nodePool: cpunp

  replicas: 1

cluster: tep-centralus-1

timeoutSeconds: 3600
